<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo — نظام دعوات الزواج</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:"AIzaSyAmqV7g32Ui_q7sFmj7H5mOMrewjtn4pjk",
      authDomain:"wedding-qr-dd5aa.firebaseapp.com",
      databaseURL:"https://wedding-qr-dd5aa-default-rtdb.firebaseio.com",
      projectId:"wedding-qr-dd5aa",
      storageBucket:"wedding-qr-dd5aa.firebasestorage.app",
      messagingSenderId:"994055652336",
      appId:"1:994055652336:web:6bbb553799ab7bd5f9d335"
    });
    const db = firebase.database();
  </script>
  <style>
    :root { --gold:#c9a84c; --brown:#6b3f1f; --bg:#fdf8f2; --border:#e8d9c0; --green:#2ecc71; --red:#e74c3c; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); direction:rtl; }
    header { background:linear-gradient(135deg,var(--brown),#a0522d); color:#fff; padding:22px 24px; display:flex; align-items:center; justify-content:space-between; }
    header h1 { font-size:22px; }
    header p { font-size:12px; opacity:.8; margin-top:3px; }
    header a { color:var(--gold); font-size:14px; text-decoration:none; border:1px solid var(--gold); padding:6px 14px; border-radius:8px; }
    .wrap { max-width:960px; margin:0 auto; padding:20px 16px; }
    .box { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:20px; }
    .box h2 { font-size:15px; color:var(--brown); margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--gold); }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
    .stat { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px 10px; text-align:center; }
    .stat .num { font-size:28px; font-weight:700; color:var(--brown); }
    .stat .lbl { font-size:11px; color:#888; margin-top:2px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(195px,1fr)); gap:14px; }
    .g-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; }
    .g-card .g-name { font-size:14px; font-weight:600; margin-bottom:4px; }
    .g-card .g-count { font-size:12px; color:#888; margin-bottom:8px; }
    .g-card img { width:100%; border-radius:6px; display:block; }
    .badge { display:inline-block; margin:8px 0; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:600; }
    .waiting { background:#fff3cd; color:#856404; }
    .entered { background:#d1e7dd; color:#0a3622; }
    .loading { text-align:center; padding:40px; color:#bbb; }
    .add-form-row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    .add-form-row > .field-name { flex:1; min-width:160px; }
    input[type=text] { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:15px; font-family:inherit; direction:rtl; background:var(--bg); }
    .count-ctrl { display:flex; align-items:center; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
    .count-ctrl button { width:38px; height:42px; background:none; border:none; font-size:22px; color:var(--brown); cursor:pointer; }
    .count-ctrl span { width:36px; text-align:center; font-size:16px; font-weight:700; }
    button { padding:10px 20px; border:none; border-radius:8px; font-size:14px; font-family:inherit; cursor:pointer; }
    .btn-primary { background:var(--brown); color:#fff; }
    .btn-gold { background:var(--gold); color:#fff; }
    .btn-danger { background:var(--red); color:#fff; }
    .btn-sm { padding:6px 13px; font-size:13px; }
    .prog-wrap { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin-bottom:20px; }
    .prog-label { display:flex; justify-content:space-between; font-size:13px; color:#666; margin-bottom:8px; }
    .prog-bar { height:14px; background:#eee; border-radius:10px; overflow:hidden; }
    .prog-fill { height:100%; background:linear-gradient(90deg,var(--green),#27ae60); border-radius:10px; transition:width .6s ease; }
    label { font-size:13px; color:#666; display:block; margin-bottom:5px; }
  </style>
</head>
<body>
<header>
  <div>
    <h1>🌸 إدارة دعوات الزواج</h1>
    <p>لوحة تحكم المنظمين — قسم النساء</p>
  </div>
  <a href="dashboard.html">📊 لوحة الحضور</a>
</header>
<div class="wrap">

  <div class="box">
    <h2>➕ إضافة مدعوات</h2>
    <div class="add-form-row">
      <div class="field-name">
        <label>اسم المدعوة</label>
        <input type="text" placeholder="أم سارة الغامدي" />
      </div>
      <div>
        <label>عدد الأشخاص</label>
        <div class="count-ctrl">
          <button>−</button>
          <span>3</span>
          <button>+</button>
        </div>
      </div>
      <div style="align-self:flex-end">
        <button class="btn-primary">✚ إضافة</button>
      </div>
    </div>
  </div>

  <div class="box">
    <h2>📋 قائمة المدعوات</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="cTotal">—</div><div class="lbl">بطاقات</div></div>
      <div class="stat"><div class="num" id="cPeople" style="color:#c9a84c">—</div><div class="lbl">إجمالي أشخاص</div></div>
      <div class="stat"><div class="num" id="cEntered" style="color:var(--green)">—</div><div class="lbl">دخلوا</div></div>
      <div class="stat"><div class="num" id="cRemain" style="color:var(--red)">—</div><div class="lbl">لم يدخلوا</div></div>
    </div>
    <input type="text" placeholder="🔍 بحث باسم الضيفة..." style="margin-bottom:14px" />
    <div id="grid" class="grid"><div class="loading">جاري تحميل البيانات...</div></div>
  </div>
</div>

<script>
  db.ref('guests').once('value', snap => {
    const guests = snap.val() || {};
    const entries = Object.entries(guests);
    const total = entries.length;
    const totalPeople = entries.reduce((s,[,g]) => s+(g.count||1), 0);
    const entered = entries.filter(([,g])=>g.used).reduce((s,[,g])=>s+(g.count||1),0);
    document.getElementById('cTotal').textContent = total;
    document.getElementById('cPeople').textContent = totalPeople;
    document.getElementById('cEntered').textContent = entered;
    document.getElementById('cRemain').textContent = totalPeople - entered;

    const grid = document.getElementById('grid');
    if (total === 0) { grid.innerHTML = '<div class="loading">لا توجد بطاقات</div>'; return; }
    grid.innerHTML = '';
    entries.slice(0,12).forEach(([id,g]) => {
      const div = document.createElement('div');
      div.className = 'g-card';
      div.innerHTML = `
        <div class="g-name">${g.name}</div>
        <div class="g-count">👥 ${g.count||1} ${(g.count||1)===1?'شخص':'أشخاص'}</div>
        <div style="background:#f5f0eb;border-radius:6px;padding:20px;margin:8px 0;font-size:11px;color:#999">[ رمز QR ]</div>
        <span class="badge ${g.used?'entered':'waiting'}">${g.used?'✅ دخلوا':'⏳ لم يدخلوا'}</span>`;
      grid.appendChild(div);
    });
  });
</script>
</body>
</html>
